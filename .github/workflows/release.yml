# Builds a signed APK and publishes a GitHub Release when a version tag (v0.5.0, v0.6.0, ...) is pushed.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   BRAINHEALTH_KEYSTORE_BASE64    the signing key file, base64-encoded on one line
#   BRAINHEALTH_KEYSTORE_PASSWORD  its store and key password
# Release notes come from the tag's message (git tag -a v0.6.0 -m "notes").
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      # SHA-256 of the certificate the installed app was signed with; a different key can't update it
      EXPECTED_CERT: d88b43a70d3d7f776e14a5118ae3092c9130f627aea5f558b01b1cc96f67d769
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match versionName $VERSION in android/app/build.gradle"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install, test and build the web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAINHEALTH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRAINHEALTH_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the BRAINHEALTH_KEYSTORE_BASE64 and BRAINHEALTH_KEYSTORE_PASSWORD secrets first"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/brainhealth.keystore
          {
            echo "storeFile=brainhealth.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=brainhealth"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/keystore.properties

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check it's signed with your key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -oP 'SHA-256 digest: \K[0-9a-f]+' | head -1)
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK is signed with a different key ($CERT); it would not install over the app on the phone"
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "brain-health-$TAG.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "brain-health-$TAG.apk" --title "Brain Health $TAG" --notes-from-tag --verify-tag

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/brainhealth.keystore android/keystore.properties
